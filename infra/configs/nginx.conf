server {
    listen 443 ssl;
    server_name telesco-pi.local;
    ssl_certificate /etc/telesco-pi/tls/fullchain.pem;
    ssl_certificate_key /etc/telesco-pi/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Telesco-Pi Observatory";
    auth_basic_user_file /etc/telesco-pi/htpasswd;

    root /opt/telesco-pi/apps/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
